id = "B3.16.22.i"
title = "φ(q) の積表示"

[source]
book = "Berndt, Ramanujan's Notebooks, Part III (Springer, 1991)"
part = 3
chapter = 16
chapter_basis = "ページ位置から推定。原本で未確認"
entry = "22(i)"
page = 36
citations = ["Rajkhowa, Saikia, arXiv:2305.14988, eq. (1.4)"]
original_checked = false

[statement]
latex = '\varphi(q) := f(q,q) = \sum_{t=-\infty}^{\infty} q^{t^2} = \frac{(-q;-q)_\infty}{(q;-q)_\infty}'
domain = "q ∈ ℂ, |q| < 1"
meaning = "f(q,q) の積表示。"
known_proofs = ["Entry 19 の特別な場合"]

[lean]
file = "RamanujanLean/Berndt/Part3/Ch16/Entry22.lean"
theorems = [
  "RamanujanLean.Berndt.Part3.Ch16.entry22_i",
  "RamanujanLean.Berndt.Part3.Ch16.entry22_i_ramanujanTheta",
]
reuses = [
  "RamanujanLean.Berndt.Part3.Ch16.entry19（a = b = q と置いた）",
  "QseriesFormalization.PartI.Ch04.eulerPentagonalInfiniteProduct_ne_zero（(q⁴;q⁴)_∞ ≠ 0。Euler の恒等式 (-q;q²)_∞(q;q²)_∞(-q²;q²)_∞ = 1 で割るために使った）",
  "QseriesFormalization.PartI.Ch02.summable_norm_mul_geometric_complex（∏(1 ± c rⁿ) と ∏(1 ± r^{n+1}) の収束）",
]
formulation_notes = """
仮定は ‖q‖ < 1 だけで、原典にない仮定は足していない。
積は (x;r)_∞ = ∏_{n≥0}(1 - x rⁿ) の約束で、(-q;-q)_∞ を ∏(1 - (-q)^{n+1})、(q;-q)_∞ を ∏(1 - q(-q)ⁿ) と書いた。底が -q のまま見える形にし、q^{2n+1} などへ展開した式には置き換えていない。
積はそれぞれ HasProd で、級数は HasSum で書き、収束と値を同時に主張する。Lean では x / 0 = 0 なので、分母の積 (q;-q)_∞ が 0 でないことも結論に入れた。分母が 0 でないことを、命題だけから読み取れるようにするため。
級数は2つ主張する。f(q,q) の項 ramanujanThetaTerm q q t の ℤ 上の和と、Σ_{t∈ℤ} q^{t²} の和で、どちらも同じ値に収束する。
entry22_i_ramanujanTheta 単体は tsum の等式で、収束の主張は entry22_i にある。
"""

