]
reuses = ["QseriesFormalization.PartI.Ch04.eulerPentagonalInfiniteProduct_eq_tsum'"]
formulation_notes = "級数と積はどちらも HasSum と HasProd で書き、収束と値を同時に主張する。tsum だけの等式にすると、収束しないとき 0 = 0 で通ってしまうため。"

