id = "B3.16.22.iii"
title = "f(-q) = (q;q)_∞（Euler の五角数定理）"

[source]
book = "Berndt, Ramanujan's Notebooks, Part III (Springer, 1991)"
part = 3
chapter = 16
chapter_basis = "ページ位置から推定（Part III の最初の章が第16章）。原本で未確認"
entry = "22(iii)"
page = 36
citations = ["Rajkhowa, Saikia, arXiv:2305.14988, eq. (1.6)。Berndt Part III p.36 Entry 22(i)-(iii) として引用"]
original_checked = false

[statement]
latex = 'f(-q) := f(-q,-q^2) = \sum_{t=-\infty}^{\infty} (-1)^t q^{t(3t-1)/2} = (q;q)_\infty'
domain = "q ∈ ℂ, |q| < 1"
meaning = "Ramanujan の一般テータ関数 f(a,b) に a=-q, b=-q² を入れた級数が、無限積 ∏_{n≥1}(1-q^n) に等しい。"
known_proofs = ["Euler の五角数定理。Berndt Part III は Entry 19（Jacobi の三重積）の特別な場合として扱う"]

